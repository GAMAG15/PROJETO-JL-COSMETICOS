{% extends 'loja/base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><h2>Produtos</h2><a class="btn btn-primary" href="{% url 'produto_create' %}">+ Novo produto</a></div><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Nome</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Ações</th></tr></thead><tbody>{% for p in produtos %}<tr><td>{{ p.nome }}</td><td>{{ p.categoria }}</td><td>R$ {{ p.preco }}</td><td>{{ p.estoque }}</td><td><a class="btn btn-sm btn-outline-primary" href="{% url 'produto_update' p.pk %}">Editar</a> <a class="btn btn-sm btn-outline-danger" href="{% url 'produto_delete' p.pk %}">Excluir</a></td></tr>{% empty %}<tr><td colspan="5">Nenhum produto cadastrado.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
