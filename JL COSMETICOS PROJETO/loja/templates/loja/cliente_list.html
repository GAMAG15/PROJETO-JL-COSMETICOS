{% extends 'loja/base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><h2>Clientes</h2><a class="btn btn-primary" href="{% url 'cliente_create' %}">+ Novo cliente</a></div><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Nome</th><th>E-mail</th><th>Telefone</th><th>Endereço</th><th>Ações</th></tr></thead><tbody>{% for c in clientes %}<tr><td>{{ c.nome }}</td><td>{{ c.email }}</td><td>{{ c.telefone }}</td><td>{{ c.endereco }}</td><td><a class="btn btn-sm btn-outline-primary" href="{% url 'cliente_update' c.pk %}">Editar</a> <a class="btn btn-sm btn-outline-danger" href="{% url 'cliente_delete' c.pk %}">Excluir</a></td></tr>{% empty %}<tr><td colspan="5">Nenhum cliente cadastrado.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
